# Haunting Ground (USA, SLUS-21075) native port: settings of hauntingground.exe.
# Read at start-up; written with these defaults when it is missing ("hauntingground.exe --write-settings" only writes it).
# Each setting becomes an environment variable for this run. A variable already set in the environment wins, and
# the command line (--headless, --window, --time-limit) wins over both.
# Relative paths are resolved against the folder that holds hauntingground.exe.

[Game]
# Your own Haunting Ground (USA) disc image. Empty = the first .iso in a "game" folder (next to hauntingground.exe or up
# to three folders above it) whose SYSTEM.CNF boots cdrom0:\SLUS_210.75;1.
Iso=

[Run]
# 1 = hidden: the window is created invisible and the sound is muted. 0 = a normal window.
Headless=1
# Wall-clock limit of the run in seconds (0 = none). At the limit hauntingground.exe writes a hang dump (guest threads,
# DMA, timers, the hottest guest PCs; HG_DUMP_RAM below), asks the runtime to stop and exits with code 124.
TimeLimitSeconds=120
# The hang dump at the time limit: 1 = yes, 0 = no.
DumpOnTimeLimit=1
# A call to a guest address with no recompiled function: stop (log the target, write PS2X_DUMP_RAM_ON_MISSING,
# stop the run, exit code 5), continue, break (debugger) or skip (debug only: hides bugs).
MissingFunction=stop
# stdout and stderr: empty = the console; a file name = appended to that file.
LogFile=

[Video]
# native = the runtime's own GS (default). pcsx2 = pcsx2gs.dll, only in a build configured with -DHG_PCSX2_GS=ON
# (its game fixes and texture folder are still Urban Reign's).
Renderer=native
# Internal resolution: 1 = native PS2, 2..8 = that many samples per pixel each way. The God Hand port ran 3 at full speed
# on a modern GPU. Haunting Ground copies its frame with one sprite (no God Hand-style flicker filter); its screen
# effects above 1x are still being checked, so 1 stays the default.
InternalResolution=1
# Ignored while Headless=1. StartFullscreen = borderless full screen (F11 switches back to a window); the picture keeps
# the PS2's 4:3 shape.
StartMaximized=0
StartFullscreen=0

[Runtime]
# Environment switches of the runtime (PS2X_*) and of this port (HG_*), passed through as written.
# The 32 MB of guest RAM, written when the run stops on a missing function.
PS2X_DUMP_RAM_ON_MISSING=logs/missing_ram.bin
# The 32 MB of guest RAM, written by the hang dump (time limit, HG_HANG_DUMP).
HG_DUMP_RAM=logs/timeout_ram.bin
# Port trace categories: BOOT,LOADER,FILE,EE,IOP,GS,VU,SPU2,INPUT,GAME,HOOK or ALL. Empty = off.
HG_TRACE=
# Host thread placement: off leaves the OS scheduler alone (auto|spread|ccx place the runtime's threads).
PS2X_THREAD_POLICY=off
# FPS overlay (F3): 0 = off.
PS2X_SHOW_FPS=0
# The branch trace printed with a missing function needs PS2X_BRANCH_TRACE=<entries> in the real environment before
# hauntingground.exe starts (the runtime reads it before main), so it has no effect here; "python build.py boot" sets it.
# Controls: controls.ini next to hauntingground.exe (HG_CONTROLS_FILE=<file> for another one). F1 in the game (or
# Back+Start on a controller) opens the Controls screen that rebinds keys, mouse buttons and controller buttons and
# saves that file (rows show Haunting Ground's actions). Player 1 default layout:
# D-pad on the arrow keys, Triangle/Square/Cross/Circle on I/J/K/L, left stick on WASD, Start = Enter,
# Select = Backspace, L1/R1 = Q/E, L2/R2 = 1/3, L3/R3 = C/V, right stick (Hewie) = T/G/F/H; controllers keep their
# normal buttons. PS2X_PAD1_* lines
# here are only read to write controls.ini when it is missing. F12 = the debugger.
