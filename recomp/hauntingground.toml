[general]
# Haunting Ground (USA, SLUS-21075), boot ELF SLUS_210.75 sha256 3B374D53...DACB8. Modeled on the God Hand port's
# recomp/godhand.toml. build.py generate rewrites input and output to build/ and makes ghidra_output absolute (relative
# to this folder). input is replaced by build/SLUS_210.75.recomp.elf: the disc ELF with the section headers of
# hauntingground_sections.csv (code .text 0x100000-0x3A1B80 and .sinit 0x464480-0x469460 executable; VU microcode
# .vutext; data, rodata, the .ctors table and .bss not executable). Program headers and loaded bytes are unchanged.
# Without that split the ELF's single RWX section 0x100000-0x47B200 would make ps2_recomp decode ~870 KB of data as code.
input = "../build/SLUS_210.75"
output = "../generated"
single_file_output = false
output_worker_threads = 8
# Function boundaries (port_prep/boundaries/scripts: build_boundaries.py + validate_boundaries.py, RESULT OK; 11,452 rows:
# main 11,309 + sinit 143, no hole, no overlap). Every row has a non-auto name, so every range is authoritative in merge
# mode and the recompiler's own start discoveries inside them are dropped (elf_parser.cpp extractFunctions).
ghidra_output = "hauntingground_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
# SDK functions are bound by address to runtime handlers at start-up (src/hg/hle_bindings.cpp + hg_sdk_functions.inc);
# the CSV carries SDK names that would otherwise be stubbed by name (types.h default is true).
auto_stub_by_name = false
# Tail jumps go through the dispatch table, so a replaced (HLE) function is reached by every caller.
direct_tail_calls = false
# Nothing is skipped: the data blocks are not executable sections in the recompiler ELF, so no function exists there.
# (God Hand skipped 46 functions its WAX .data produced; the libkernl kernel-patch blobs that InitExecPS2/InitAlarm/
# InitTLBFunctions copy to kernel RAM are at 0x3EAA70, 0x3EB0E0, 0x3EB8A8 and 0x3EBFE8 here, inside .data.)
skip = []
stubs = []
# No runtime_relocations: Haunting Ground loads no code at run time (no overlay or DLL loader; recon/elf_disc ELF_DISC.md).
